<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bảng theo dõi DTI &amp; PAR INDEX v5.2 — Xã Phước Hải</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #f5f2ea;
    --paper: #ffffff;
    --ink: #1e2a44;
    --ink-soft: #4b5774;
    --ink-faint: #8089a0;
    --line: #ddd6c4;
    --accent: #b8862e;
    --accent-soft: #f0e3c4;
    --accent-deep: #8a611c;
    --done: #2f7d4f;
    --done-bg: #e4f1e8;
    --progress: #c8862e;
    --progress-bg: #faf0dc;
    --pending: #8b93a6;
    --pending-bg: #edeff3;
    --overdue: #b23b3b;
    --overdue-bg: #fbe7e6;
    --shadow: 0 1px 2px rgba(30,42,68,.06), 0 8px 24px -12px rgba(30,42,68,.18);
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;line-height:1.5;}
  h1,h2,h3,.serif{font-family:'Source Serif 4',Georgia,serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button,select,input,textarea{font-family:inherit;font-size:inherit;color:inherit;}
  ::selection{background:var(--accent-soft);}

  .app{max-width:1180px;margin:0 auto;padding:0 0 64px;}

  /* ---------- Topbar ---------- */
  .topbar{position:relative;background:var(--ink);color:#fff;padding:22px 28px 20px;overflow:hidden;}
  .topbar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
    background:linear-gradient(90deg,var(--accent) 0%,var(--accent) 60%,#7a2222 60%,#7a2222 100%);}
  .topbar__row{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;flex-wrap:wrap;}
  .topbar__brand{display:flex;align-items:center;gap:16px;}
  .seal{width:54px;height:54px;border-radius:50%;border:2px solid var(--accent);position:relative;flex:none;
    display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 30%, #2a3a5c, #1e2a44 70%);}
  .seal svg{width:100%;height:100%;}
  .topbar__title{margin:0;font-size:20px;font-weight:600;letter-spacing:.2px;}
  .topbar__sub{margin:3px 0 0;font-size:12.5px;color:#c7cfe0;letter-spacing:.3px;}
  .topbar__meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .updater-field{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:6px 10px;}
  .updater-field label{font-size:11.5px;color:#c7cfe0;white-space:nowrap;}
  .updater-field input{background:transparent;border:none;color:#fff;width:140px;outline:none;font-size:13px;}
  .updater-field input::placeholder{color:#8c95ad;}
  .save-state{font-size:11.5px;color:#c7cfe0;display:flex;align-items:center;gap:6px;white-space:nowrap;}
  .save-dot{width:7px;height:7px;border-radius:50%;background:var(--pending);}
  .save-dot.saving{background:var(--progress);animation:pulse 1s infinite;}
  .save-dot.saved{background:#6fcf97;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  /* ---------- Tabs ---------- */
  .tabs{display:flex;gap:2px;background:var(--ink);padding:0 24px;flex-wrap:wrap;}
  .tab{appearance:none;border:none;background:transparent;color:#aab3c6;padding:12px 16px;cursor:pointer;
    font-size:13.5px;font-weight:500;border-bottom:3px solid transparent;letter-spacing:.2px;}
  .tab:hover{color:#fff;}
  .tab.active{color:#fff;border-bottom-color:var(--accent);}

  /* ---------- Toolbar ---------- */
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:16px 24px 0;}
  .search-input{flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);}
  .chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--paper);
    cursor:pointer;font-size:12.5px;color:var(--ink-soft);white-space:nowrap;}
  .chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  select.chip{appearance:auto;}

  .panel{padding:18px 24px 0;}
  .hint{color:var(--ink-faint);font-size:12.5px;margin:2px 0 14px;}

  /* ---------- KPI cards ---------- */
  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
  @media (max-width:880px){.kpi-grid{grid-template-columns:repeat(2,1fr);}}
  .kpi-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);}
  .kpi-card__label{font-size:11.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;}
  .kpi-card__value{font-family:'Source Serif 4',serif;font-size:28px;font-weight:600;display:flex;align-items:baseline;gap:6px;}
  .kpi-card__value small{font-size:14px;color:var(--ink-faint);font-family:'IBM Plex Sans',sans-serif;}
  .kpi-card__foot{font-size:12px;color:var(--ink-soft);margin-top:6px;}
  .kpi-ring{display:flex;align-items:center;gap:14px;}
  .kpi-ring svg{flex:none;}

  /* ---------- Group bars ---------- */
  .bars{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);margin-bottom:14px;}
  .bars h3{margin:0 0 12px;font-size:14.5px;}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
  .bar-row__label{width:200px;flex:none;font-size:12.5px;color:var(--ink-soft);}
  .bar-row__track{flex:1;height:9px;background:var(--pending-bg);border-radius:999px;overflow:hidden;}
  .bar-row__fill{height:100%;background:linear-gradient(90deg,var(--accent-deep),var(--accent));border-radius:999px;}
  .bar-row__val{width:64px;flex:none;text-align:right;font-size:12px;color:var(--ink-faint);}

  /* ---------- Groups / items ---------- */
  .group{margin-bottom:16px;}
  .group__head{display:flex;align-items:center;justify-content:space-between;background:var(--ink);color:#fff;
    padding:10px 14px;border-radius:8px 8px 0 0;cursor:pointer;}
  .group__head h3{margin:0;font-size:14px;font-weight:600;}
  .group__head .meta{font-size:11.5px;color:#c7cfe0;}
  .group__body{border:1px solid var(--line);border-top:none;border-radius:0 0 8px 8px;background:var(--paper);}
  .group__body.collapsed{display:none;}

  .item-row{border-bottom:1px solid var(--line);padding:12px 14px;}
  .item-row:last-child{border-bottom:none;}
  .item-row__top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;cursor:pointer;}
  .item-row__title{display:flex;gap:10px;align-items:flex-start;}
  .item-code{font-size:10.5px;color:var(--ink-faint);white-space:nowrap;padding-top:2px;}
  .item-name{font-size:13.3px;color:var(--ink);}
  .item-row__right{display:flex;align-items:center;gap:8px;flex:none;}
  .badge{font-size:10.5px;padding:2px 7px;border-radius:5px;border:1px solid var(--line);color:var(--ink-soft);white-space:nowrap;}
  .badge--max{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent-deep);font-weight:600;}
  .status-pill{font-size:11px;padding:3px 9px;border-radius:999px;font-weight:600;white-space:nowrap;}
  .status-pill[data-s="chua"]{background:var(--pending-bg);color:var(--pending);}
  .status-pill[data-s="dangtrienkhai"]{background:var(--progress-bg);color:var(--progress);}
  .status-pill[data-s="hoanthanh"]{background:var(--done-bg);color:var(--done);}
  .status-pill[data-s="khongdat"]{background:var(--overdue-bg);color:var(--overdue);}
  .chevron{color:var(--ink-faint);font-size:11px;flex:none;padding-top:3px;}

  .item-detail{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);display:none;}
  .item-detail.open{display:block;}
  .item-detail__criteria{font-size:12px;color:var(--ink-soft);background:#faf8f2;border:1px solid var(--line);
    border-radius:6px;padding:8px 10px;margin-bottom:10px;}
  .field-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  @media (max-width:760px){.field-grid{grid-template-columns:repeat(2,1fr);}}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.4px;}
  .field select,.field input{padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;}
  .field textarea{padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;resize:vertical;min-height:36px;font-size:12.5px;}
  .field--wide{grid-column:span 2;}
  @media (max-width:760px){.field--wide{grid-column:span 2;}}
  .item-footrow{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:11px;color:var(--ink-faint);}
  .stale-flag{color:var(--overdue);font-weight:600;}
  .quick-done{border:1px solid var(--done);color:var(--done);background:#fff;border-radius:6px;padding:4px 9px;cursor:pointer;font-size:11px;}
  .quick-done:hover{background:var(--done-bg);}

  /* ---------- Đơn vị tab ---------- */
  .dv-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow);}
  .dv-card__head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px;}
  .dv-card__head h3{margin:0;font-size:14px;}
  .dv-stats{display:flex;gap:14px;font-size:11.5px;color:var(--ink-soft);flex-wrap:wrap;}
  .dv-stats b{color:var(--ink);}
  .dv-list{display:flex;flex-direction:column;gap:6px;}
  .dv-list-item{display:flex;justify-content:space-between;gap:10px;font-size:12.3px;padding:6px 8px;background:#faf8f2;border-radius:6px;}
  .dv-list-item .nm{flex:1;}

  /* ---------- Footer actions ---------- */
  .footer-actions{display:flex;justify-content:flex-end;margin:18px 24px 0;}
  .btn-primary{background:var(--ink);color:#fff;border:none;border-radius:8px;padding:10px 18px;cursor:pointer;font-size:13px;font-weight:600;}
  .btn-primary:hover{background:#16213a;}

  /* ---------- Modal ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(15,20,33,.55);display:none;align-items:flex-start;justify-content:center;padding:60px 20px 20px;z-index:50;}
  .modal-overlay.open{display:flex;}
  .modal{background:#fff;border-radius:12px;max-width:640px;width:100%;max-height:84vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35);}
  .modal__head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
  .modal__head h3{margin:0;font-size:15px;}
  .modal__close{border:none;background:none;font-size:18px;cursor:pointer;color:var(--ink-faint);}
  .modal__body{padding:16px 20px;overflow:auto;}
  .modal__body textarea{width:100%;height:340px;border:1px solid var(--line);border-radius:8px;padding:12px;font-family:'IBM Plex Mono',monospace;font-size:11.8px;line-height:1.6;}
  .modal__foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;}
  .btn-ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:9px 16px;cursor:pointer;font-size:12.5px;}

  /* Modal cập nhật tiến độ */
  .um-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
  .um-grid .full{grid-column:1/-1;}
  @media (max-width:600px){.um-grid{grid-template-columns:1fr;}}
  .hist-list{display:flex;flex-direction:column;gap:0;max-height:200px;overflow-y:auto;}
  .hist-line{font-size:11.5px;color:var(--ink-soft);padding:6px 0;border-bottom:1px dashed var(--line);line-height:1.5;}
  .hist-line:last-child{border-bottom:none;}
  .hist-line b{color:var(--ink);font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:10.8px;}
  .hist-empty{font-size:12px;color:var(--ink-faint);padding:8px 0;}
  .toast{position:fixed;bottom:22px;right:22px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:8px;font-size:12.5px;font-weight:600;opacity:0;transform:translateY(10px);transition:all .3s;z-index:999;max-width:380px;line-height:1.5;pointer-events:none;box-shadow:var(--shadow);}
  .toast.show{opacity:1;transform:translateY(0);}
  .attach-line{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:11.5px;}
  .attach-line:last-child{border-bottom:none;}
  .attach-line .nm{flex:1;color:var(--ink);word-break:break-all;}
  .attach-line .nm a{color:var(--ink);text-decoration:none;}
  .attach-line .nm a:hover{text-decoration:underline;color:var(--accent-deep);}
  .attach-line .meta{color:var(--ink-faint);font-size:10.5px;white-space:nowrap;}
  .attach-del{border:none;background:none;color:var(--overdue);cursor:pointer;font-size:13px;padding:2px 4px;opacity:.6;flex:none;}
  .attach-del:hover{opacity:1;}
  .attach-uploading{color:var(--progress);font-style:italic;}
  .clip-badge{font-size:10px;color:var(--ink-faint);white-space:nowrap;}

  /* Criteria editor */
  .crit-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
  .crit-stab{padding:6px 14px;border-radius:6px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-size:12.5px;font-weight:500;color:var(--ink-soft);}
  .crit-stab.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .crit-table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;max-height:60vh;overflow-y:auto;}
  .crit-table{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--paper);}
  .crit-table th{background:var(--ink);color:#fff;padding:8px 10px;text-align:left;white-space:nowrap;font-size:11.5px;position:sticky;top:0;z-index:2;}
  .crit-table td{padding:5px 7px;border-bottom:1px solid var(--line);vertical-align:middle;}
  .crit-table tr:hover td{background:#faf8f2;} .crit-table tr.crit-new td{background:#f0fff4;}
  .crit-inp{width:100%;padding:4px 6px;border:1px solid transparent;border-radius:4px;background:transparent;font-size:12.5px;font-family:inherit;min-width:55px;}
  .crit-inp:focus{border-color:var(--accent);background:#fff;outline:none;} .crit-inp.num{width:52px;text-align:right;}
  .btn-del-row{border:none;background:none;color:var(--overdue);cursor:pointer;font-size:14px;padding:2px 5px;opacity:.5;} .btn-del-row:hover{opacity:1;}
  .btn-add-row{width:100%;margin-top:8px;padding:8px;border:1.5px dashed var(--accent);border-radius:7px;background:transparent;color:var(--accent-deep);font-size:12.5px;cursor:pointer;font-family:inherit;} .btn-add-row:hover{background:var(--accent-soft);}
  .btn-save-crit{background:var(--done);color:#fff;border:none;border-radius:7px;padding:9px 20px;cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;} .btn-save-crit:disabled{background:#bbb;cursor:not-allowed;}
  .crit-pill-mod{background:var(--progress-bg);color:var(--progress);border:1px solid var(--progress);border-radius:4px;padding:2px 8px;font-size:11px;font-weight:600;}
  .crit-pill-ok{background:var(--done-bg);color:var(--done);border:1px solid var(--done);border-radius:4px;padding:2px 8px;font-size:11px;font-weight:600;}
  .empty{padding:30px 10px;text-align:center;color:var(--ink-faint);font-size:13px;}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="topbar__row">
      <div class="topbar__brand">
        <div class="seal" title="Tiến độ DTI ước tính">
          <svg viewBox="0 0 54 54"><circle id="sealRing" cx="27" cy="27" r="21" fill="none" stroke="#b8862e" stroke-width="3" stroke-dasharray="0 1000" stroke-linecap="round" transform="rotate(-90 27 27)"/></svg>
        </div>
        <div>
          <h1 class="topbar__title serif">Bảng điều hành theo dõi Chuyển đổi số &amp; CCHC</h1>
          <p class="topbar__sub">Xã Phước Hải · Phụ lục DTI.Xã &amp; PAR INDEX 2026 · v5.2</p>
        </div>
      </div>
      <div class="topbar__meta">
        <div class="updater-field">
          <label>Người cập nhật</label>
          <input id="updaterInput" placeholder="Họ tên cán bộ..." />
        </div>
        <div id="authArea" style="display:flex;align-items:center;margin-right:4px;"></div>
        <div class="save-state"><span class="save-dot" id="saveDot"></span><span id="saveText">Sẵn sàng</span></div>
      </div>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="dashboard">Tổng quan</button>
    <button class="tab" data-tab="dti">DTI cấp xã (43)</button>
    <button class="tab" data-tab="par">PAR INDEX (81)</button>
    <button class="tab" data-tab="donvi">Theo đơn vị</button>
    <button class="tab" data-tab="criteria" id="critTab" style="display:none">Bộ chỉ số ✏️</button>
  </div>

  <div id="content"></div>

  <div class="footer-actions">
    <button class="btn-primary" id="exportBtn">Tạo biên bản tổng hợp tiến độ</button>
    <button class="btn-primary" id="exportExcelBtn" style="background:#1e6e3a;border-color:#155a2f;" onclick="exportToExcel()">📊 Xuất Excel</button>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal__head"><h3 class="serif">Biên bản tổng hợp tiến độ</h3><button class="modal__close" id="modalClose">✕</button></div>
    <div class="modal__body"><textarea id="reportText" readonly></textarea></div>
    <div class="modal__foot">
      <button class="btn-ghost" id="modalCloseBtn">Đóng</button>
      <button class="btn-primary" id="copyBtn">Sao chép nội dung</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="updateModalOverlay">
  <div class="modal">
    <div class="modal__head">
      <div>
        <h3 class="serif" id="umTitle">Cập nhật tiến độ</h3>
        <div id="umSub" style="font-size:11.5px;color:var(--ink-faint);margin-top:2px;"></div>
      </div>
      <button class="modal__close" id="umClose">✕</button>
    </div>
    <div class="modal__body">
      <div class="um-grid">
        <div class="field">
          <label>Trạng thái</label>
          <select id="umStatus">
            <option value="chua">Chưa triển khai</option>
            <option value="dangtrienkhai">Đang triển khai</option>
            <option value="hoanthanh">Hoàn thành</option>
            <option value="khongdat">Không đạt / quá hạn</option>
          </select>
        </div>
        <div class="field">
          <label>Tiến độ (%)</label>
          <input type="number" min="0" max="100" id="umProgress" />
        </div>
        <div class="field full">
          <label>Kết quả / số liệu</label>
          <input type="text" id="umResult" placeholder="VD: 92% hồ sơ trực tuyến" />
        </div>
        <div class="field full">
          <label>Ghi chú cập nhật</label>
          <textarea id="umNote" placeholder="Ghi chú, văn bản căn cứ..." style="min-height:60px;"></textarea>
        </div>
        <div class="field full">
          <label>Người cập nhật</label>
          <input type="text" id="umUpdater" placeholder="Họ tên cán bộ..." />
        </div>
      </div>
      <button type="button" id="umQuickDone" style="border:1px solid var(--done);color:var(--done);background:#fff;border-radius:6px;padding:5px 11px;cursor:pointer;font-size:11.5px;margin-bottom:18px;font-family:inherit;">Đánh dấu hoàn thành 100%</button>

      <div style="border-top:1px dashed var(--line);padding-top:12px;margin-bottom:14px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:6px;">
          <span style="font-size:11px;font-weight:600;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.4px;">📎 Tài liệu minh chứng</span>
          <label class="btn-ghost" id="umAttachBtn" style="cursor:pointer;padding:5px 12px;font-size:11.5px;margin:0;">
            + Chọn file
            <input type="file" id="umFileInput" multiple accept=".pdf,.jpg,.jpeg,.png,.gif,.webp,.xls,.xlsx,.doc,.docx,.rar,.zip" style="display:none;">
          </label>
        </div>
        <div style="font-size:10.5px;color:var(--ink-faint);margin-bottom:8px;">PDF, ảnh, Excel, Word, RAR, ZIP — tối đa 15MB/file.</div>

<script>
// ====================== STATE & STORAGE ======================

// Mutable copies — overridden by Sheets if configured
let dtiCriteria = DTI_DATA.map(x => Object.assign({}, x));

let criteriaModified = false;
let critActiveSource = 'DTI';

// Hướng dẫn: https://script.google.com > Deploy > New deployment > Web App
// URL Web App lưu trong localStorage — không cần sửa file HTML
const LS_URL_KEY = 'phuochai-webapp-url';

const STATUS_LABEL = { chua: 'Chưa triển khai', dangtrienkhai: 'Đang triển khai', hoanthanh: 'Hoàn thành', khongdat: 'Không đạt / quá hạn' };
const STALE_DAYS = 45;

let statusMap = {};
let umAttachCounts = {};
let updaterName = '';
let activeTab = 'dashboard';
let search = '';
let statusFilter = 'all';
let donViFilter = 'all';
let collapsedGroups = {};
let openDetails = {};
let saveTimer = null;
let syncTimer = null;
let lastSyncAt = null;
let SYNC_INTERVAL_MS = 90000;

// ---------- Quản lý URL cấu hình ----------
function getWebAppUrl() {
  return (localStorage.getItem(LS_URL_KEY) || '').trim();
}
function setWebAppUrl(url) {
  localStorage.setItem(LS_URL_KEY, url.trim());
}
function isConfigured() {
  const u = getWebAppUrl();
  return u.startsWith('https://script.google.com/');
}

// ---------- API calls ----------
async function apiCall(params) {
  if (!isConfigured()) throw new Error('NOT_CONFIGURED');
  const url = getWebAppUrl() + '?' + new URLSearchParams(params).toString();
  const res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || 'Lỗi server');
  return json.data;
}

async function apiPost(body) {
  if (!isConfigured()) throw new Error('NOT_CONFIGURED');
  var _b = Object.assign({}, body);
  if(currentUser&&currentUser.adminToken) _b._adminToken=currentUser.adminToken;
  if(currentUser&&currentUser.idToken)    _b._idToken=currentUser.idToken;
  const res = await fetch(getWebAppUrl(), {
    method: 'POST',
    body: JSON.stringify(_b),
    headers: { 'Content-Type': 'text/plain' }
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || 'Lỗi server');
  return json.data;
}

function getStatus(id){
  return statusMap[id] || { status: 'chua', progress: 0, result: '', note: '', updatedAt: null, updatedBy: '' };
}
function setStatus(id,patch){const cur=getStatus(id);statusMap[id]=Object.assign({},cur,patch,{updatedAt:Date.now(),updatedBy:updaterName||cur.updatedBy||''});saveLocalCache();const item=allItems().find(it=>it.id===id);apiUpdateRow(id,item?item.source:'',statusMap[id]);scheduleSave();}

async function loadAll(){
  // Luôn thử load từ localStorage trước (cache cục bộ) để hiện nhanh
  const cached = localStorage.getItem('phuochai-cache');
  if (cached) {
    try {
      const c = JSON.parse(cached);
      statusMap = c.statusMap || {};
      updaterName = c.updaterName || '';
    } catch(e) {}
  }
  // Sau đó đồng bộ từ Google Sheets
  if (isConfigured()) {
    await syncFromServer();
  }
  if(isConfigured()){try{await loadCriteriaFromServer();}catch(e){}}
  if(isConfigured()){try{await loadAttachCounts();}catch(e){}}
  startAutoSync();
}

async function syncFromServer() {
  try {
    setSaveState('syncing');
    const data = await apiCall({ action: 'getData', sheet: 'ALL' });
    if (data && data.statusMap) {
      // Merge: ưu tiên bản mới hơn theo updatedAt
      Object.keys(data.statusMap).forEach(id => {
        const server = data.statusMap[id];
        const local  = statusMap[id];
        if (!local || !local.updatedAt || (server.updatedAt && server.updatedAt > local.updatedAt)) {
          statusMap[id] = server;
        }
      });
    }
    if (data && data.updaterName && !updaterName) {
      updaterName = data.updaterName;
    }
    lastSyncAt = Date.now();
    saveLocalCache();
    setSaveState('synced');
    renderActiveTab();
  } catch(e) {
    setSaveState('offline');
  }
}

function saveLocalCache() {
  try {
    localStorage.setItem('phuochai-cache', JSON.stringify({ statusMap, updaterName, cachedAt: Date.now() }));
  } catch(e) {}
}

function startAutoSync() {
  if (syncTimer) clearInterval(syncTimer);
  if (!isConfigured()) return;
  syncTimer = setInterval(async () => {
    await syncFromServer();
    updateSyncBadge();
  }, SYNC_INTERVAL_MS);
}

function updateSyncBadge() {
  const el = document.getElementById('syncInfo');
  if (!el || !lastSyncAt) return;
  const sec = Math.round((Date.now() - lastSyncAt) / 1000);
  el.textContent = 'Đồng bộ: ' + (sec < 5 ? 'Vừa xong' : sec + 'g trước');
}

function setSaveState(state){
  const dot = document.getElementById('saveDot');
  const txt = document.getElementById('saveText');
  if (!dot || !txt) return;
  const states = {
    saving:  { cls: 'saving', lbl: 'Đang lưu...' },
    saved:   { cls: 'saved',  lbl: isConfigured() ? 'Đã lưu → Google Sheets' : 'Đã lưu (máy này)' },
    syncing: { cls: 'saving', lbl: 'Đang đồng bộ...' },
    synced:  { cls: 'saved',  lbl: 'Đã đồng bộ ✓' },
    offline: { cls: '',       lbl: 'Ngoại tuyến — dữ liệu tạm lưu cục bộ' },
    error:   { cls: '',       lbl: 'Lỗi lưu — thử lại' },
    idle:    { cls: '',       lbl: isConfigured() ? 'Đã kết nối Google Sheets' : 'Chưa cấu hình (lưu cục bộ)' }
  };
  const s = states[state] || states.idle;
  dot.className = 'save-dot' + (s.cls ? ' ' + s.cls : '');
  txt.textContent = s.lbl;
}

// OFFLINE QUEUE
let syncQueue=[];let isOnline=navigator.onLine;
window.addEventListener('online',()=>{isOnline=true;flushSyncQueue();});
window.addEventListener('offline',()=>{isOnline=false;});
function queueUpdate(id,source,s){syncQueue=syncQueue.filter(q=>q.id!==id);syncQueue.push({id,source,status:s.status,progress:s.progress,result:s.result,note:s.note});localStorage.setItem('phuochai-syncqueue',JSON.stringify(syncQueue));}
async function flushSyncQueue(){if(!isConfigured()||syncQueue.length===0)return;const items=[...syncQueue];syncQueue=[];localStorage.removeItem('phuochai-syncqueue');for(const item of items){try{await apiPost({action:'updateRow',id:item.id,source:item.source,status:item.status,progress:item.progress,result:item.result,note:item.note,updaterName});}catch(e){syncQueue.push(item);}}if(syncQueue.length>0)localStorage.setItem('phuochai-syncqueue',JSON.stringify(syncQueue));}
async function apiUpdateRow(id,source,s){if(!isConfigured()){setSaveState('saved');return;}if(!isOnline){queueUpdate(id,source,s);setSaveState('offline');return;}try{await apiPost({action:'updateRow',id,source,status:s.status,progress:s.progress,result:s.result,note:s.note,updaterName});setSaveState('saved');lastSyncAt=Date.now();updateSyncBadge();flushSyncQueue();}catch(e){queueUpdate(id,source,s);setSaveState('offline');}}
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{saveLocalCache();renderActiveTab();},400);}

async function saveUpdaterName(v){
  updaterName = v;
  saveLocalCache();
  if (isConfigured()) {
    try { await apiPost({ action: 'saveUpdater', name: v }); } catch(e) {}
  }
}

// ====================== HELPERS ======================
function daysAgo(ts){ if(!ts) return null; return Math.floor((Date.now()-ts)/86400000); }
function fmtAgo(ts){
  if(!ts) return 'Chưa từng cập nhật';
  const d = daysAgo(ts);
  if(d===0) return 'Hôm nay';
  if(d===1) return '1 ngày trước';
  return d + ' ngày trước';
}
function isStale(item){
  const s = getStatus(item.id);
  if(s.status==='hoanthanh') return false;
  if(!s.updatedAt) return true;
  return daysAgo(s.updatedAt) > STALE_DAYS;
}
function norm(s){ return (s||'').toString().toLowerCase(); }

function allItems(){
  return dtiCriteria.map(it=>Object.assign({source:'DTI'}, it))
    .concat(parCriteria.map(it=>Object.assign({source:'PAR'}, it)));
}

function groupBy(items, keyFn){
  const map = new Map();
  items.forEach(it=>{
    const k = keyFn(it) || 'Khác';
    if(!map.has(k)) map.set(k, []);
    map.get(k).push(it);
  });
  return map;
}

function matchesFilters(item){
  const s=getStatus(item.id);
  if(donViFilter!=='all'&&(item.chu_tri||'Chưa phân công')!==donViFilter)return false;
  if(statusFilter !== 'all'){
    if(statusFilter === 'stale'){ if(!isStale(item)) return false; }
    else if(s.status !== statusFilter) return false;
  }
  if(search){
    const q = norm(search);
    const hay = norm(item.ten) + ' ' + norm(item.chu_tri) + ' ' + norm(item.id) + ' ' + norm(item.ma||'');
    if(!hay.includes(q)) return false;
  }
  return true;
}

// ====================== AGGREGATES ======================
function computeDTIScore(){
  let earned = 0, max = 0;
  DTI_DATA.forEach(it=>{
    const s = getStatus(it.id);
    max += it.diem_toi_da || 0;
    earned += (it.diem_toi_da || 0) * (Math.min(100, s.progress||0) / 100);
  });
  return { earned: Math.round(earned*10)/10, max };
}
function computeDTIByGroup(){
  const groups = groupBy(DTI_DATA, it=>it.nhom);
  const out = [];
  groups.forEach((items, nhom)=>{
    let earned=0, max=0;
    items.forEach(it=>{
      const s = getStatus(it.id);
      max += it.diem_toi_da||0;
      earned += (it.diem_toi_da||0) * (Math.min(100,s.progress||0)/100);
    });
    out.push({ nhom, earned: Math.round(earned*10)/10, max });
  });
  return out;
}
function computePARCompletion(){
  let done=0, inprog=0, total=PAR_DATA.length;
  PAR_DATA.forEach(it=>{
    const s = getStatus(it.id);
    if(s.status==='hoanthanh') done++;
    else if(s.status==='dangtrienkhai') inprog++;
  });
  return { done, inprog, total, pct: total? Math.round(done/total*1000)/10 : 0 };
}
function computePARByLinhVuc(){
  const items = PAR_DATA.filter(it=>it.phan && it.phan.indexOf('ĐÁNH GIÁ KẾT QUẢ')===0);
  const groups = groupBy(items, it=>it.linh_vuc);
  const out = [];
  groups.forEach((arr, lv)=>{
    let done=0;
    arr.forEach(it=>{ if(getStatus(it.id).status==='hoanthanh') done++; });
    out.push({ linh_vuc: lv, done, total: arr.length });
  });
  return out;
}
function computeStaleCount(){
  return allItems().filter(isStale).length;
}
function computeByDonVi(){
  const items = allItems();
  const groups = groupBy(items, it=>it.chu_tri || 'Chưa phân công');
  const out = [];
  groups.forEach((arr, dv)=>{
    let done=0, prog=0, chua=0, stale=0;
    arr.forEach(it=>{
      const s = getStatus(it.id);
      if(s.status==='hoanthanh') done++;
      else if(s.status==='dangtrienkhai') prog++;
      else chua++;
      if(isStale(it)) stale++;
    });
    out.push({ dv, items: arr, done, prog, chua, stale, total: arr.length });
  });
  return out.sort((a,b)=> (b.total-b.done) - (a.total-a.done));
}

function ringSvg(pct, size, stroke){
  size = size||64; stroke = stroke||7;
  const r = (size-stroke)/2, c = 2*Math.PI*r;
  const off = c * (1-Math.min(100,pct)/100);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#edeff3" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#b8862e" stroke-width="${stroke}"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round" transform="rotate(-90 ${size/2} ${size/2})"/>
  </svg>`;
}

function renderActiveTab(){
  const c = document.getElementById('content');
  if(activeTab==='dashboard') c.innerHTML = renderDashboard();
  else if(activeTab==='dti') c.innerHTML = renderDTITab();
  else if(activeTab==='par') c.innerHTML = renderPARTab();
  else if(activeTab==='criteria') c.innerHTML = renderCriteriaTab();
  else c.innerHTML = renderDonViTab();
  bindContentEvents();
}

function bindContentEvents(){
  const c = document.getElementById('content');
  const searchInput = document.getElementById('searchInput');
  if(searchInput){
    searchInput.addEventListener('input', e=>{ search = e.target.value; renderActiveTab(); searchInput.focus(); searchInput.setSelectionRange(search.length, search.length); });
  }
  const dvf=document.getElementById('donViFilterSelect');if(dvf){const dvSet=new Set(allItems().map(it=>it.chu_tri||'Chưa phân công'));dvf.innerHTML="<option value='all'>Tất cả đơn vị</option>"+[...dvSet].sort().map(function(d){return "<option value='"+d+"' "+(donViFilter===d?'selected':'')+">"+d+"</option>";}).join('');dvf.addEventListener('change',e=>{donViFilter=e.target.value;renderActiveTab();});}
  const sf = document.getElementById('statusFilterSelect');
  if(sf){ sf.addEventListener('change', e=>{ statusFilter = e.target.value; renderActiveTab(); }); }

  c.querySelectorAll('[data-toggle]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-toggle');
      openDetails[id] = !openDetails[id];
      const det = document.getElementById('detail-'+id);
      const chev = document.getElementById('chev-'+id);
      det.classList.toggle('open', openDetails[id]);
      chev.textContent = openDetails[id] ? '▴' : '▾';
    });
  });
  c.querySelectorAll('[data-grouptoggle]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const gid = el.getAttribute('data-grouptoggle');
      collapsedGroups[gid] = !collapsedGroups[gid];
      renderActiveTab();
    });
  });
  c.querySelectorAll('[data-act="openupdate"]').forEach(el=>{
    el.addEventListener('click', e=>{
      e.stopPropagation();
      openUpdateModal(el.getAttribute('data-id'));
    });
  });
}

// ====================== MODAL CẬP NHẬT TIẾN ĐỘ ======================
let umItemId = null;

function openUpdateModal(id){
  const item = allItems().find(it=>it.id===id);
  if(!item) return;
  umItemId = id;
  const s = getStatus(id);
  document.getElementById('umTitle').textContent = (item.ma||item.id) + ' — ' + item.ten;
  const parts = [];
  const nhomTxt = item.nhom || item.phan || item.linh_vuc || '';
  if(nhomTxt) parts.push('Nhóm: ' + nhomTxt);
  parts.push('Chủ trì: ' + (item.chu_tri || 'Chưa phân công'));
  if(item.diem_toi_da!=null) parts.push('Điểm tối đa: ' + item.diem_toi_da + ' đ');
  document.getElementById('umSub').textContent = parts.join(' · ');
  document.getElementById('umStatus').value = s.status || 'chua';
  document.getElementById('umProgress').value = s.progress || 0;
  document.getElementById('umResult').value = s.result || '';
  document.getElementById('umNote').value = s.note || '';
  document.getElementById('umUpdater').value = updaterName || '';
  document.getElementById('umMsg').textContent = '';
  document.getElementById('umHistory').innerHTML = 'Đang tải...';
  document.getElementById('umAttachList').innerHTML = 'Đang tải...';
  document.getElementById('updateModalOverlay').classList.add('open');
  loadHistory(id);
  loadAttachments(id);
}

function closeUpdateModal(){
  document.getElementById('updateModalOverlay').classList.remove('open');
  umItemId = null;
}

async function loadHistory(id){
  const box = document.getElementById('umHistory');
  if(!isConfigured()){ box.innerHTML = '<div class="hist-empty">Chưa cấu hình kết nối máy chủ — không tải được lịch sử.</div>'; return; }
  try{
    const data = await apiCall({ action:'getLog', id });
    const logs = (data && data.logs) || [];
    if(!logs.length){ box.innerHTML = '<div class="hist-empty">Chưa có lịch sử cập nhật.</div>'; return; }
    const FIELD_LABEL = { status:'Trạng thái', progress:'Tiến độ', result:'Kết quả', note:'Ghi chú' };
    box.innerHTML = logs.map(l=>{
      const time = l.timestamp ? new Date(l.timestamp).toLocaleString('vi-VN') : '';
      const fieldLbl = FIELD_LABEL[l.field] || l.field;
      const newVal = l.field==='status' ? (STATUS_LABEL[l.newValue]||l.newValue) : (l.newValue || '—');
      return '<div class="hist-line"><b>'+safeEsc(time)+'</b> — '+safeEsc(l.updatedBy||'—')+': '+safeEsc(fieldLbl)+' → <i>'+safeEsc(newVal)+'</i></div>';
    }).join('');
  }catch(e){
    box.innerHTML = '<div class="hist-empty">Không tải được lịch sử (có thể máy chủ chưa hỗ trợ chức năng này).</div>';
  }
}

function saveUpdateModal(){
  if(!umItemId) return;
  const id = umItemId;
  const name = document.getElementById('umUpdater').value.trim();
  if(name){ updaterName = name; document.getElementById('updaterInput').value = name; }
  let v = parseFloat(document.getElementById('umProgress').value); if(isNaN(v)) v=0; v=Math.max(0,Math.min(100,v));
  setStatus(id, {
    status: document.getElementById('umStatus').value,
    progress: v,
    result: document.getElementById('umResult').value.trim(),
    note: document.getElementById('umNote').value.trim()
  });
  renderActiveTab();
  closeUpdateModal();
  toastMsg('✓ Đã lưu cập nhật tiến độ.');
}

function toastMsg(m){
  let t = document.getElementById('umToast');
  if(!t){ t = document.createElement('div'); t.id = 'umToast'; t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = m;
  t.classList.add('show');
  clearTimeout(window._umToastTimer);
  window._umToastTimer = setTimeout(()=> t.classList.remove('show'), 2600);
}

const ATTACH_EXT_ALLOW = ['pdf','jpg','jpeg','png','gif','webp','xls','xlsx','doc','docx','rar','zip'];
const ATTACH_MAX_MB = 15;

async function loadAttachCounts(){
  if(!isConfigured()) return;

    const data = await apiCall({ action:'getAttachmentCounts' });

  }catch(e){ /* im lặng — máy chủ có thể chưa hỗ trợ chức năng này */ }

async function loadAttachments(id){
  const box = document.getElementById('umAttachList');
  if(!isConfigured()){ box.innerHTML = '<div class="hist-empty">Chưa cấu hình kết nối máy chủ.</div>'; return; }
  try{
    const data = await apiCall({ action:'getAttachments', id });
    renderAttachList(id, (data && data.files) || []);
  }catch(e){
    box.innerHTML = '<div class="hist-empty">Không tải được danh sách tài liệu (có thể máy chủ chưa hỗ trợ chức năng này — xem ghi chú triển khai).</div>';
  }
}

function fmtSize(bytes){
  bytes = Number(bytes)||0;
  if(!bytes) return '';
  if(bytes < 1024*1024) return Math.round(bytes/1024) + ' KB';
  return (bytes/1024/1024).toFixed(1) + ' MB';
}

function renderAttachList(id, files){
  const box = document.getElementById('umAttachList');
  if(!files.length){ box.innerHTML = '<div class="hist-empty">Chưa có tài liệu đính kèm.</div>'; return; }
  box.innerHTML = files.map(f => '<div class="attach-line" data-fileid="'+safeEsc(f.fileId)+'">'
    +'<span class="nm">📄 <a href="'+safeEsc(f.fileUrl)+'" target="_blank" rel="noopener">'+safeEsc(f.fileName)+'</a></span>'
    +'<span class="meta">'+fmtSize(f.size)+' · '+safeEsc(f.uploadedBy||'—')+'</span>'
    +(canUpdate()?'<button class="attach-del" data-act="delattach" data-fileid="'+safeEsc(f.fileId)+'" data-id="'+safeEsc(id)+'" title="Xóa">🗑</button>':'')
    +'</div>').join('');
  box.querySelectorAll('[data-act="delattach"]').forEach(btn=>{
    btn.addEventListener('click', ()=> handleDeleteAttachClick(btn.getAttribute('data-fileid'), btn.getAttribute('data-id')));
  });
}

function handleFileSelect(e){
  const files = Array.from(e.target.files || []);
  e.target.value = ''; // cho phép chọn lại đúng file này ở lần sau
  if(!umItemId) return;
  files.forEach(f => uploadOneAttachment(umItemId, f));
}

function uploadOneAttachment(id, file){
  const ext = (file.name.split('.').pop()||'').toLowerCase();
  if(ATTACH_EXT_ALLOW.indexOf(ext) === -1){
    toastMsg('✕ Định dạng ".' + ext + '" không được hỗ trợ.');
    return;
  }
  if(file.size > ATTACH_MAX_MB*1024*1024){
    toastMsg('✕ File "' + file.name + '" vượt quá ' + ATTACH_MAX_MB + 'MB.');
    return;
  }
  if(!isConfigured()){
    toastMsg('✕ Chưa cấu hình kết nối máy chủ — không thể tải file lên.');
    return;
  }
  if(!isOnline){
    toastMsg('✕ Đang ngoại tuyến — vui lòng thử lại khi có mạng.');
    return;
  }
  const box = document.getElementById('umAttachList');
  if(box.querySelector('.hist-empty')) box.innerHTML = '';
  const rowId = 'up-' + Date.now() + '-' + Math.random().toString(36).slice(2,7);
  box.insertAdjacentHTML('afterbegin', '<div class="attach-line" id="'+rowId+'"><span class="nm attach-uploading">⏳ Đang tải lên: '+safeEsc(file.name)+'...</span></div>');

  const reader = new FileReader();
  reader.onload = async function(){
    const base64 = String(reader.result).split(',')[1] || '';
    try{
      await apiPost({
        action: 'uploadAttachment',
        id: id,
        fileName: file.name,
        mimeType: file.type || 'application/octet-stream',
        base64: base64,
        updaterName: updaterName
      });
      umAttachCounts[id] = (umAttachCounts[id]||0) + 1;
      toastMsg('✓ Đã đính kèm "' + file.name + '".');
      if(umItemId === id) loadAttachments(id);
    }catch(err){
      const row = document.getElementById(rowId);
      if(row) row.innerHTML = '<span class="nm" style="color:var(--overdue)">✕ Lỗi tải lên: '+safeEsc(file.name)+'</span>';
      toastMsg('✕ Không tải lên được "' + file.name + '".');
    }
  };
  reader.onerror = function(){
    toastMsg('✕ Không đọc được file "' + file.name + '".');
  };
  reader.readAsDataURL(file);
}

async function handleDeleteAttachClick(fileId, id){
  if(!confirm('Xóa tài liệu này khỏi hệ thống?')) return;
  try{
    await apiPost({ action:'deleteAttachment', fileId:fileId, id:id });
    umAttachCounts[id] = Math.max(0, (umAttachCounts[id]||1) - 1);
    toastMsg('✓ Đã xóa tài liệu.');
    if(umItemId === id) loadAttachments(id);
  }catch(e){
    toastMsg('✕ Không xóa được tài liệu.');
  }
}

  var now = new Date();
  var dateStr = now.toLocaleDateString('vi-VN');
  var wb = XLSX.utils.book_new();

  // ── Sheet 1: DTI cấp xã ──
  var dtiHeader = ['ID','Nhóm','Tên chỉ số','Điểm tối đa','Chủ trì','Loại','Trạng thái','Tiến độ (%)','Kết quả','Ghi chú','Cập nhật lúc','Người cập nhật'];
  var dtiRows = dtiCriteria.map(function(it){
    var s = statusMap[it.id] || {};
    var trangThai = {chua:'Chưa thực hiện', dangtrienkhai:'Đang triển khai', hoanthanh:'Hoàn thành', khongdat:'Không đạt'}[s.status||'chua'] || 'Chưa thực hiện';

  });
  var dtiData = [['BỘ CHỈ SỐ DTI CẤP XÃ — PHƯỚC HẢI — '+dateStr]].concat([dtiHeader]).concat(dtiRows);
  var wsDTI = XLSX.utils.aoa_to_sheet(dtiData);

  wsDTI['!cols'] = [50,120,220,80,100,50,130,80,200,200,130,120].map(function(w){return {wch:Math.round(w/7)};});
  XLSX.utils.book_append_sheet(wb, wsDTI, 'DTI cấp xã');

  // ── Sheet 2: PAR INDEX ──
  var parHeader = ['ID','Mã','Phần','Lĩnh vực','Tên tiêu chí','Chủ trì','Loại','Trạng thái','Tiến độ (%)','Kết quả','Ghi chú','Cập nhật lúc','Người cập nhật'];
  var parRows = parCriteria.map(function(it){
    var s = statusMap[it.id] || {};
    var trangThai = {chua:'Chưa thực hiện', dangtrienkhai:'Đang triển khai', hoanthanh:'Hoàn thành', khongdat:'Không đạt'}[s.status||'chua'] || 'Chưa thực hiện';
    var updAt = s.updatedAt ? new Date(s.updatedAt).toLocaleString('vi-VN') : '';
    return [it.id, it.ma||'', it.phan||'', it.linh_vuc||'', it.ten||'', it.chu_tri||'', it.loai||'', trangThai, s.progress||0, s.result||'', s.note||'', updAt, s.updatedBy||''];
  });
  var parData = [['BỘ CHỈ SỐ PAR INDEX — PHƯỚC HẢI — '+dateStr]].concat([parHeader]).concat(parRows);
  var wsPAR = XLSX.utils.aoa_to_sheet(parData);
  wsPAR['!merges'] = [{s:{r:0,c:0}, e:{r:0,c:12}}];
  wsPAR['!cols'] = [50,50,140,120,220,100,50,130,80,200,200,130,120].map(function(w){return {wch:Math.round(w/7)};});
  XLSX.utils.book_append_sheet(wb, wsPAR, 'PAR INDEX');

  // ── Sheet 3: Tổng hợp ──
  function calcStats(arr){
    var st = {total:arr.length, hoanthanh:0, dangtrienkhai:0, chua:0, khongdat:0, earned:0, maxScore:0};
    arr.forEach(function(it){
      var s = statusMap[it.id]||{};
      st[s.status||'chua'] = (st[s.status||'chua']||0) + 1;
      st.maxScore += it.diem_toi_da||0;
      st.earned   += (it.diem_toi_da||0) * (Math.min(100, s.progress||0)/100);
    });
    return st;
  }
  var ds = calcStats(dtiCriteria);

  var tongHopData = [
    ['TỔNG HỢP KẾT QUẢ — XÃ PHƯỚC HẢI — '+dateStr],

    ['BỘ CHỈ SỐ','TỔNG CHỈ SỐ','HOÀN THÀNH','ĐANG TRIỂN KHAI','CHƯA THỰC HIỆN','KHÔNG ĐẠT','ĐIỂM ĐẠT','ĐIỂM TỐI ĐA','TỶ LỆ (%)'],

      ds.earned.toFixed(1), ds.maxScore.toFixed(1), ds.maxScore>0?(ds.earned/ds.maxScore*100).toFixed(1)+'%':'0%'],
    ['PAR INDEX',  ps.total, ps.hoanthanh, ps.dangtrienkhai, ps.chua, ps.khongdat,
      ps.earned.toFixed(1), ps.maxScore.toFixed(1), ps.maxScore>0?(ps.earned/ps.maxScore*100).toFixed(1)+'%':'0%'],
  ];

  XLSX.utils.book_append_sheet(wb, wsTH, 'Tổng hợp');

  // Xuất file
  var fileName = 'BaoCao_DTI_PAR_PhuocHai_' + now.getFullYear() + ('0'+(now.getMonth()+1)).slice(-2) + ('0'+now.getDate()).slice(-2) + '.xlsx';
  XLSX.writeFile(wb, fileName);
}

// ====================== REPORT EXPORT ======================
function buildReportText(){
  const now = new Date();
  const dti = computeDTIScore();
  const par = computePARCompletion();
  const stale = computeStaleCount();
  const byDv = computeByDonVi();
  const dtiGroups = computeDTIByGroup();

  let lines = [];
  lines.push('BIÊN BẢN TỔNG HỢP TIẾN ĐỘ — CHUYỂN ĐỔI SỐ (DTI) & CẢI CÁCH HÀNH CHÍNH (PAR INDEX)');
  lines.push('Đơn vị: UBND xã Phước Hải   |   Thời điểm tổng hợp: ' + now.toLocaleString('vi-VN'));
  lines.push('');
  lines.push('I. KẾT QUẢ TỔNG QUÁT');
  lines.push(`- Điểm DTI cấp xã ước tính: ${dti.earned}/${dti.max} điểm (${dti.max? Math.round(dti.earned/dti.max*1000)/10:0}%)`);
  lines.push(`- PAR INDEX: ${par.done}/${par.total} nội dung đã hoàn thành (${par.pct}%), ${par.inprog} nội dung đang triển khai`);
  lines.push(`- Số chỉ tiêu/nhiệm vụ chưa cập nhật quá ${STALE_DAYS} ngày: ${stale}/${DTI_DATA.length+PAR_DATA.length}`);
  lines.push('');
  lines.push('II. CHI TIẾT ĐIỂM DTI THEO NHÓM CHỈ SỐ');
  dtiGroups.forEach(g=> lines.push(`- ${g.nhom}: ${g.earned}/${g.max} điểm`));
  lines.push('');
  lines.push('III. KHỐI LƯỢNG CÔNG VIỆC THEO ĐƠN VỊ CHỦ TRÌ');
  byDv.forEach(d=> lines.push(`- ${d.dv}: ${d.done}/${d.total} hoàn thành, ${d.prog} đang triển khai, ${d.chua} chưa triển khai${d.stale? `, ${d.stale} quá hạn cập nhật`:''}`));
  lines.push('');
  lines.push('IV. DANH MỤC CẦN ƯU TIÊN XỬ LÝ NGAY (chưa cập nhật / quá hạn)');
  const staleItems = allItems().filter(isStale).slice(0,40);
  if(staleItems.length===0) lines.push('- Không có mục nào quá hạn cập nhật.');
  staleItems.forEach(it=>{
    const s = getStatus(it.id);
    lines.push(`- [${it.source}] ${it.ten} (Chủ trì: ${it.chu_tri||'chưa phân công'}; trạng thái: ${STATUS_LABEL[s.status]}; ${fmtAgo(s.updatedAt)})`);
  });
  if(allItems().filter(isStale).length>40) lines.push(`... và ${allItems().filter(isStale).length-40} mục khác (xem chi tiết trong công cụ).`);
  lines.push('');
  lines.push('— Hết —');
  return lines.join('\n');
}

function closeSetupModal() {
  const o = document.getElementById('setupOverlay');
  if (o) o.style.display = 'none';
}

function onSetupUrlChange() {
  const val = (document.getElementById('setupUrlInput').value || '').trim();
  const valid = val.startsWith('https://script.google.com/macros/s/') && val.endsWith('/exec');
  const hint  = document.getElementById('setupUrlHint');
  const testBtn = document.getElementById('setupTestBtn');
  const saveBtn = document.getElementById('setupSaveBtn');

  if (!val) {
    hint.style.color = '#8089a0';
    hint.textContent = 'URL phải bắt đầu bằng https://script.google.com/macros/s/';
  } else if (!valid) {
    hint.style.color = '#b23b3b';
    hint.textContent = '⚠ URL chưa đúng định dạng — phải kết thúc bằng /exec';
  } else {
    hint.style.color = '#2f7d4f';
    hint.textContent = '✓ Định dạng URL hợp lệ — nhấn Kiểm tra kết nối';
  }

  testBtn.disabled = !valid;
  testBtn.style.cursor = valid ? 'pointer' : 'not-allowed';
  testBtn.style.background = valid ? '#fff' : '#f5f2ea';
  testBtn.style.color = valid ? '#1e2a44' : '#8089a0';
  testBtn.style.borderStyle = valid ? 'solid' : 'dashed';
  testBtn.style.borderColor = valid ? '#ddd6c4' : '#ddd6c4';

  // Save chỉ enable sau khi test thành công — reset nếu URL thay đổi
  saveBtn.disabled = true;
  saveBtn.style.background = '#ccc';
  saveBtn.style.cursor = 'not-allowed';
  document.getElementById('setupTestResult').textContent = '';
}

async function testConnection() {
  const val = (document.getElementById('setupUrlInput').value || '').trim();
  const result = document.getElementById('setupTestResult');
  const testBtn = document.getElementById('setupTestBtn');

  testBtn.textContent = '⏳ Đang kiểm tra...';
  testBtn.disabled = true;
  result.style.color = '#8089a0';
  result.textContent = 'Đang gửi yêu cầu đến Google Apps Script...';

  try {
    const url = val + '?action=ping';
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || 'Server trả lỗi');

    result.style.color = '#2f7d4f';
    result.textContent = '✅ Kết nối thành công! Server phản hồi lúc ' + new Date(json.data.time).toLocaleTimeString('vi-VN');

    const saveBtn = document.getElementById('setupSaveBtn');
    saveBtn.disabled = false;
    saveBtn.style.background = '#2f7d4f';
    saveBtn.style.cursor = 'pointer';
  } catch(e) {
    result.style.color = '#b23b3b';
    result.innerHTML = '❌ Kết nối thất bại: <b>' + e.message + '</b><br>'
      + '<span style="font-size:11px">Kiểm tra: Deploy đúng chưa? Access = Anyone? Đã Authorize chưa?</span>';
  }

  testBtn.textContent = '🔌 Kiểm tra kết nối';
  testBtn.disabled = false;
}

async function saveSetup() {
  const val = (document.getElementById('setupUrlInput').value || '').trim();
  setWebAppUrl(val);
  var _cid=(document.getElementById('setupClientIdInput')||{}).value||''; if(_cid.trim()) localStorage.setItem('phuochai-gis-client-id',_cid.trim());
  closeSetupModal();
  renderConnectionBanner();
  setSaveState('syncing');
  await syncFromServer();
  startAutoSync();
  updateSyncBadge();
  renderActiveTab();
}



// ====================== PHÂN QUYỀN (AUTH) ======================
// VIEWER  (mặc định) : chỉ xem, không cần đăng nhập
// EDITOR  (Gmail)    : cập nhật tiến độ/kết quả, cần đăng nhập Google
// ADMIN   (PIN)      : toàn quyền — chỉnh sửa bộ chỉ số, quản lý
// ================================================================

const ROLE_VIEWER = 'viewer';
const ROLE_EDITOR = 'editor';
const ROLE_ADMIN  = 'admin';

let currentUser = null;
// { email, name, picture, idToken, role, adminToken }

function getRole(){ return currentUser ? currentUser.role : ROLE_VIEWER; }
function canEdit()  { return getRole() === ROLE_ADMIN; }
function canUpdate(){ return getRole() === ROLE_EDITOR || getRole() === ROLE_ADMIN; }

function safeEsc(s){
  var t = String(s||'');
  t = t.split('&').join('&amp;');

async function verifyAdminPin(){
  var name = (document.getElementById('adminNameInput').value||'').trim() || 'Quản trị viên';
  var pin  = (document.getElementById('adminPinInput').value||'').trim();
  var msg  = document.getElementById('adminPinMsg');
  var btn  = document.getElementById('adminPinBtn');
  if(!pin){ msg.textContent = 'Vui lòng nhập mã PIN.'; return; }

  // Nếu chưa cấu hình Web App URL, dùng xác thực cục bộ (chế độ offline)
  if(!isConfigured()){
    var ADMIN_PIN_LOCAL = 'PhuocHai@2026';
    if(pin !== ADMIN_PIN_LOCAL){
      msg.style.color = '#b23b3b';
      msg.textContent = 'Mã PIN không đúng.';
      document.getElementById('adminPinInput').value = '';
      document.getElementById('adminPinInput').focus();
      return;
    }
    var token = 'local-' + Math.random().toString(36).slice(2);
    _applyAdminSession(name, token);
    return;
  }

  // Xác thực PIN với server để nhận token hợp lệ (bắt buộc để lưu lên Sheets)
  btn.disabled = true; btn.textContent = '⏳ Đang xác thực...';
  msg.style.color = '#b23b3b'; msg.textContent = '';
  try {
    var res = await fetch(getWebAppUrl(), {
      method: 'POST',
      body: JSON.stringify({action:'verifyPin', pin:pin}),
      headers: {'Content-Type':'text/plain'}
    });
    var json = await res.json();
    if(!json.ok || !json.data || !json.data.ok){
      msg.textContent = (json.data && json.data.error) ? json.data.error : 'Mã PIN không đúng.';
      document.getElementById('adminPinInput').value = '';
      document.getElementById('adminPinInput').focus();
      btn.disabled = false; btn.textContent = 'Đăng nhập';
      return;
    }
    _applyAdminSession(name, json.data.token);
  } catch(e) {
    msg.textContent = 'Lỗi kết nối server: ' + e.message;
    btn.disabled = false; btn.textContent = 'Đăng nhập';
  }
}

function _applyAdminSession(name, token){

  updaterName = name;

function getGisClientId(){ return (localStorage.getItem('phuochai-gis-client-id')||'').trim(); }

function initGoogleSignIn(){
  var clientId = getGisClientId();
  if(!clientId || !window.google || !window.google.accounts) return;
  google.accounts.id.initialize({
    client_id: clientId,
    callback: onGoogleSignIn,
    auto_select: true,
    cancel_on_tap_outside: false
  });
  if(!currentUser) google.accounts.id.prompt();
}

async function onGoogleSignIn(credentialResponse){
  var idToken = credentialResponse.credential;
  try{
    var base64Url = idToken.split('.')[1];
    var base64 = base64Url.replace(/-/g,'+').replace(/_/g,'/');
    var jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c){
      return '%'+('00'+c.charCodeAt(0).toString(16)).slice(-2);
    }).join(''));
    var payload = JSON.parse(jsonPayload);
    var email   = payload.email   || '';
    var name    = payload.name    || email;
    var picture = payload.picture || '';

    // Không overwrite admin session
    if(currentUser && currentUser.role === ROLE_ADMIN) return;

    currentUser = {email:email, name:name, picture:picture, idToken:idToken, role:ROLE_EDITOR};
    localStorage.setItem('phuochai-editor-session', JSON.stringify({email:email, name:name, picture:picture, idToken:idToken}));

    updaterName = name;
    document.getElementById('updaterInput').value = name;
    renderTopbarAuth();
    renderConnectionBanner();
    updateTabVisibility();
    renderActiveTab();
  }catch(e){ console.error('GIS sign-in error:', e); }
}

function signOut(){
  var wasAdmin = currentUser && currentUser.role === ROLE_ADMIN;
  currentUser = null;
  if(wasAdmin){
    sessionStorage.removeItem('phuochai-admin');
  } else {
    localStorage.removeItem('phuochai-editor-session');
    if(window.google && window.google.accounts){
      google.accounts.id.disableAutoSelect();
    }
  }
  document.getElementById('updaterInput').value = '';
  updaterName = '';
  renderTopbarAuth();
  renderActiveTab();
}

// ====================== CRITERIA MANAGEMENT ======================

async function loadCriteriaFromServer(){
  if(!isConfigured()) return;
  try{
    const data = await apiCall({action:'getCriteria',sheet:'ALL'});
    let changed = false;
    if(data && data.dti && data.dti.length>0){ dtiCriteria = data.dti; changed = true; }
    if(data && data.par && data.par.length>0){ parCriteria = data.par; changed = true; }
    if(changed) renderActiveTab();
  }catch(e){}
}

async function saveCriteriaToServer(source){
  const rows = source==='DTI' ? dtiCriteria : parCriteria;
  await apiPost({action:'saveCriteria', sheet:source, rows:rows, updaterName:updaterName});
}

function genNewId(src){
  const arr = src==='DTI' ? dtiCriteria : parCriteria;
  const pfx = src==='DTI' ? 'DTI-' : 'PAR-';
  const nums = arr.map(x=>parseInt((x.id||'').replace(pfx,''))||0).filter(n=>n>0);
  const next = nums.length ? Math.max(...nums)+1 : (src==='DTI'?44:82);
  return pfx + String(next).padStart(src==='DTI'?2:3,'0');
}

function escAttr(s){
  var t = String(s||'');
  t = t.split('&').join('&amp;');
  t = t.split('"').join('&quot;');
  t = t.split('<').join('&lt;');
  return t;
}

function setCritSource(src){ critActiveSource=src; renderActiveTab(); }

function onCritChange(src, idx, el){
  const f = el.getAttribute('data-field');
  const arr = src==='DTI' ? dtiCriteria : parCriteria;
  arr[idx][f] = f==='diem_toi_da' ? parseFloat(el.value)||0 : el.value;
  criteriaModified = true;
  document.querySelectorAll('.crit-pill-mod,.crit-pill-ok').forEach(function(p){
    p.className='crit-pill-mod'; p.textContent='Có thay đổi chưa lưu';
  });
}

// ── Đơn vị chủ trì: select + tự nhập ──
var _critSaveTimer = null;
function scheduleAutoSaveCrit(src){
  clearTimeout(_critSaveTimer);
  _critSaveTimer = setTimeout(async function(){
    if(!isConfigured()) return;
    var pill = document.querySelector('.crit-pill-mod,.crit-pill-ok');
    try{
      if(pill){ pill.textContent='⏳ Đang lưu...'; }
      await saveCriteriaToServer(src);
      criteriaModified = false;
      // Pull confirmed data back from Sheets so display always matches stored values
      await loadCriteriaFromServer();
      document.querySelectorAll('.crit-pill-mod,.crit-pill-ok').forEach(function(p){
        p.className='crit-pill-ok'; p.textContent='Đã đồng bộ ✓';
      });
    }catch(e){
      document.querySelectorAll('.crit-pill-mod,.crit-pill-ok').forEach(function(p){
        p.className='crit-pill-mod'; p.textContent='Lỗi lưu — thử lại';
      });
    }
  }, 900);
}

function onChuTriSelect(src, idx, el){
  const arr = src==='DTI' ? dtiCriteria : parCriteria;
  const customInp = el.parentNode.querySelector('.crit-custom-inp');
  if(el.value === '__other__'){
    customInp.style.display = 'block';
    customInp.focus();
    arr[idx].chu_tri = customInp.value.trim();
    // Don't auto-save yet — wait for user to type a value in the custom input
    if(!arr[idx].chu_tri) return;
  } else {
    customInp.style.display = 'none';
    arr[idx].chu_tri = el.value;
  }
  criteriaModified = true;
  document.querySelectorAll('.crit-pill-mod,.crit-pill-ok').forEach(function(p){
    p.className='crit-pill-mod'; p.textContent='Có thay đổi chưa lưu';
  });
  scheduleAutoSaveCrit(src);
}

function onChuTriCustom(src, idx, el){
  const arr = src==='DTI' ? dtiCriteria : parCriteria;
  arr[idx].chu_tri = el.value.trim();
  criteriaModified = true;
  document.querySelectorAll('.crit-pill-mod,.crit-pill-ok').forEach(function(p){
    p.className='crit-pill-mod'; p.textContent='Có thay đổi chưa lưu';
  });
  scheduleAutoSaveCrit(src);
}

function resetCriteria(){
  if(!confirm('Khôi phục bộ chỉ số mặc định từ HTML?\n(Xóa toàn bộ thay đổi chưa lưu)')) return;
  dtiCriteria = DTI_DATA.map(x => Object.assign({}, x));
  parCriteria  = PAR_DATA.map(x => Object.assign({}, x));
  criteriaModified = false;
  renderActiveTab();
}

async function handleSaveCriteria(){
  const btn = document.getElementById('saveCritBtn');
  if(!isConfigured()){ openSetupModal(); return; }
  btn.disabled = true; btn.textContent = '⏳ Đang lưu...';
  try{
    await saveCriteriaToServer('DTI');
    await saveCriteriaToServer('PAR');
    criteriaModified = false;
    btn.textContent = '✅ Đã lưu!';
    setTimeout(function(){ btn.disabled=false; btn.textContent='💾 Lưu lên Sheets'; renderActiveTab(); }, 1800);
  }catch(e){
    btn.textContent='❌ Lỗi — thử lại'; btn.disabled=false;
    alert('Lỗi khi lưu: '+e.message);
  }
}

function buildChuTriCell(src, idx, val){
  const valTrimmed = (val||'').trim();
  const inList = DON_VI_LIST.indexOf(valTrimmed) >= 0;
  const isOther = valTrimmed !== '' && !inList;
  const opts = DON_VI_LIST.map(function(dv){
    return '<option value="'+escAttr(dv)+'"'+(valTrimmed===dv?' selected':'')+'>'+dv+'</option>';
  }).join('') + '<option value="__other__"'+(isOther?' selected':'')+'>— Nhập tên khác... —</option>';
  const customDisplay = isOther ? 'block' : 'none';
  const customVal = isOther ? escAttr(valTrimmed) : '';
  return '<td style="min-width:160px">'
    +'<select class="crit-inp" style="width:100%" onchange="onChuTriSelect(\''+src+'\','+idx+',this)">'+opts+'</select>'
    +'<input type="text" class="crit-inp crit-custom-inp" placeholder="Tên đơn vị chủ trì..." value="'+customVal+'"'
    +' style="display:'+customDisplay+';margin-top:3px;width:100%"'
    +' oninput="onChuTriCustom(\''+src+'\','+idx+',this)"'
    +' onblur="onChuTriCustom(\''+src+'\','+idx+',this)"/>'
    +'</td>';
}

function buildCritTable(src){
  if(src==='DTI'){
    const hds=['ID','Nhóm','Tên chỉ số','Điểm','Chủ trì','Loại','Khung','Ghi chú',''];
    const rows = dtiCriteria.map(function(it,i){
      return '<tr class="'+(it._new?'crit-new':'')+'">'
        +'<td><input class="crit-inp mono" data-field="id" value="'+escAttr(it.id)+'" onchange="onCritChange(\'DTI\','+i+',this)"/></td>'
        +'<td><input class="crit-inp" data-field="nhom" value="'+escAttr(it.nhom||'')+'" onchange="onCritChange(\'DTI\','+i+',this)"/></td>'
        +'<td><input class="crit-inp" data-field="ten" value="'+escAttr(it.ten||'')+'" onchange="onCritChange(\'DTI\','+i+',this)" style="min-width:200px"/></td>'
        +'<td><input class="crit-inp num" type="number" data-field="diem_toi_da" value="'+(it.diem_toi_da||0)+'" onchange="onCritChange(\'DTI\','+i+',this)"/></td>'
        +buildChuTriCell('DTI',i,it.chu_tri||'')
        +'<td><input class="crit-inp" data-field="loai" value="'+escAttr(it.loai||'')+'" onchange="onCritChange(\'DTI\','+i+',this)" style="width:48px"/></td>'
        +'<td><input class="crit-inp" data-field="khung" value="'+escAttr(it.khung||'')+'" onchange="onCritChange(\'DTI\','+i+',this)"/></td>'
        +'<td><input class="crit-inp" data-field="ghi_chu" value="'+escAttr(it.ghi_chu||'')+'" onchange="onCritChange(\'DTI\','+i+',this)"/></td>'
        +'<td><button class="btn-del-row" onclick="delCriteriaRow(\'DTI\','+i+')" title="Xóa">✕</button></td>'
        +'</tr>';
    }).join('');
    return '<table class="crit-table"><thead><tr>'+hds.map(function(h){return '<th>'+h+'</th>';}).join('')+'</tr></thead><tbody>'+rows+'</tbody></table>';
  } else {
    const hds=['ID','Mã','Phần','Lĩnh vực','Tên tiêu chí','Chủ trì','Loại','Khung','Ghi chú',''];
    const rows = parCriteria.map(function(it,i){
      return '<tr class="'+(it._new?'crit-new':'')+'">'
        +'<td><input class="crit-inp mono" data-field="id" value="'+escAttr(it.id)+'" onchange="onCritChange(\'PAR\','+i+',this)"/></td>'
        +'<td><input class="crit-inp" data-field="ma" value="'+escAttr(it.ma||'')+'" onchange="onCritChange(\'PAR\','+i+',this)" style="width:58px"/></td>'
        +'<td><input class="crit-inp" data-field="phan" value="'+escAttr(it.phan||'')+'" onchange="onCritChange(\'PAR\','+i+',this)" style="min-width:140px"/></td>'
        +'<td><input class="crit-inp" data-field="linh_vuc" value="'+escAttr(it.linh_vuc||'')+'" onchange="onCritChange(\'PAR\','+i+',this)"/></td>'
        +'<td><input class="crit-inp" data-field="ten" value="'+escAttr(it.ten||'')+'" onchange="onCritChange(\'PAR\','+i+',this)" style="min-width:180px"/></td>'
        +buildChuTriCell('PAR',i,it.chu_tri||'')
        +'<td><input class="crit-inp" data-field="loai" value="'+escAttr(it.loai||'')+'" onchange="onCritChange(\'PAR\','+i+',this)" style="width:48px"/></td>'
        +'<td><input class="crit-inp" data-field="khung" value="'+escAttr(it.khung||'')+'" onchange="onCritChange(\'PAR\','+i+',this)"/></td>'
        +'<td><input class="crit-inp" data-field="ghi_chu" value="'+escAttr(it.ghi_chu||'')+'" onchange="onCritChange(\'PAR\','+i+',this)"/></td>'
        +'<td><button class="btn-del-row" onclick="delCriteriaRow(\'PAR\','+i+')" title="Xóa">✕</button></td>'
        +'</tr>';
    }).join('');
    return '<table class="crit-table"><thead><tr>'+hds.map(function(h){return '<th>'+h+'</th>';}).join('')+'</tr></thead><tbody>'+rows+'</tbody></table>';
  }
}

function renderCriteriaTab(){
  const pill = criteriaModified
    ? '<span class="crit-pill-mod">Có thay đổi chưa lưu</span>'
    : '<span class="crit-pill-ok">Đã đồng bộ</span>';
  const isDTI = critActiveSource==='DTI';
  return '<div class="panel">'
    +'<div class="crit-toolbar">'
    +'<div style="display:flex;gap:4px">'
    +'<button class="crit-stab '+(isDTI?'active':'')+'" onclick="setCritSource(\'DTI\')">DTI cấp xã ('+dtiCriteria.length+')</button>'
    +'<button class="crit-stab '+(!isDTI?'active':'')+'" onclick="setCritSource(\'PAR\')">PAR INDEX ('+parCriteria.length+')</button>'
    +'</div>'+pill
    +'<div style="flex:1"></div>'
    +'<button class="btn-ghost" onclick="resetCriteria()" title="Khôi phục dữ liệu mặc định từ file HTML">↺ Mặc định</button>'
    +'<button class="btn-save-crit" id="saveCritBtn" onclick="handleSaveCriteria()">💾 Lưu lên Sheets</button>'
    +'</div>'
    +'<div class="crit-table-wrap" id="'+(isDTI?'dtiCritTable':'parCritTable')+'">'+buildCritTable(critActiveSource)+'</div>'
    +'<button class="btn-add-row" onclick="addCriteriaRow(\''+critActiveSource+'\')">+ Thêm '+(isDTI?'chỉ số DTI':'tiêu chí PAR')+' mới</button>'
    +'<p style="color:var(--ink-faint);font-size:12px;margin-top:8px">💡 Nhấp vào ô bất kỳ để chỉnh sửa inline. Nhấn <b>Lưu lên Sheets</b> để mọi người cùng thấy thay đổi.</p>'
    +'</div>';
}


// ====================== INIT ======================
async function init(){
  restoreAuthSession();
  try{syncQueue=JSON.parse(localStorage.getItem('phuochai-syncqueue')||'[]');}catch(e){syncQueue=[];}
  await loadAll();
  document.getElementById('updaterInput').value = updaterName;
  document.getElementById('updaterInput').addEventListener('change', e=> saveUpdaterName(e.target.value));
  setSaveState('idle');

  renderTopbarAuth();
  updateTabVisibility();

  // Banner trạng thái — tự render lại khi cấu hình thay đổi
  renderConnectionBanner();
  setTimeout(function(){if(window.google&&window.google.accounts)initGoogleSignIn();else{var s=document.querySelector('script[src*="gsi"]');if(s)s.onload=initGoogleSignIn;}},300);

  document.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click', ()=>{
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      activeTab = t.getAttribute('data-tab');
      search=''; statusFilter='all'; donViFilter='all';
      renderActiveTab();
    });
  });

  document.getElementById('exportBtn').addEventListener('click', ()=>{
    document.getElementById('reportText').value = buildReportText();
    document.getElementById('modalOverlay').classList.add('open');
  });
  document.getElementById('modalClose').addEventListener('click', ()=> document.getElementById('modalOverlay').classList.remove('open'));
  document.getElementById('modalCloseBtn').addEventListener('click', ()=> document.getElementById('modalOverlay').classList.remove('open'));
  document.getElementById('copyBtn').addEventListener('click', ()=>{
    const ta = document.getElementById('reportText');
    ta.select();
    try{ navigator.clipboard.writeText(ta.value); document.getElementById('copyBtn').textContent='Đã sao chép ✓'; }
    catch(e){ document.execCommand('copy'); }
    setTimeout(()=>{ document.getElementById('copyBtn').textContent='Sao chép nội dung'; }, 1800);
  });

  document.getElementById('umClose').addEventListener('click', closeUpdateModal);
  document.getElementById('umCancel').addEventListener('click', closeUpdateModal);
  document.getElementById('umSave').addEventListener('click', saveUpdateModal);
  document.getElementById('umQuickDone').addEventListener('click', ()=>{
    document.getElementById('umStatus').value = 'hoanthanh';
    document.getElementById('umProgress').value = 100;
  });
  document.getElementById('umFileInput').addEventListener('change', handleFileSelect);
  document.getElementById('updateModalOverlay').addEventListener('click', e=>{
    if(e.target.id === 'updateModalOverlay') closeUpdateModal();
  });

  updateTabVisibility();
  renderActiveTab();
}
function updateTabVisibility(){
  var ct=document.getElementById('critTab');
  if(ct) ct.style.display=canEdit()?'':'none';
}
init();

</script>
